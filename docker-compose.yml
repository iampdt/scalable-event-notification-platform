services:
  postgres:
    image: postgres:16
    container_name: notification-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: notifications
      POSTGRES_USER: notification_app
      POSTGRES_PASSWORD: local_dev_password

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notification_app -d notifications"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Local SMTP sink for the real email adapter. SMTP on 1025, web inbox on 8025.
  mailpit:
    image: axllent/mailpit:v1.21
    container_name: notification-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres_data:

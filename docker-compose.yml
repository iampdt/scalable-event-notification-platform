# Full local stack:   docker compose up -d --build
# Infrastructure only (run API/worker from your venv):   docker compose up -d postgres mailpit redis kafka

# API, worker, and migrations are one image run with different commands.
x-app: &app
  build: .
  image: notification-platform:local
  environment: &app-env
    DATABASE_URL: postgresql+psycopg://notification_app:local_dev_password@postgres:5432/notifications
    # Local-development values only; see .env.example.
    WEBHOOK_SECRET_ENCRYPTION_KEY: UtdpRhP4WrBOSC0yYXp2TYAniAUkhyKZF8AhZphjqIQ=
    WEBHOOK_ALLOW_PRIVATE_NETWORKS: "true"
    EMAIL_PROVIDER: smtp
    SMTP_HOST: mailpit
    SMTP_PORT: "1025"
    EMAIL_FROM: notifications@example.test
    REDIS_URL: redis://redis:6379/0
    KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    DISPATCH_MODE: kafka
    LOG_FORMAT: json

services:
  postgres:
    image: postgres:16
    container_name: notification-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: notifications
      POSTGRES_USER: notification_app
      POSTGRES_PASSWORD: local_dev_password

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notification_app -d notifications"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Cache + rate limiting. Deliberately not persistent: everything in it can be
  # rebuilt from PostgreSQL, and the app keeps working (degraded) if it is down.
  redis:
    image: redis:7.4-alpine
    container_name: notification-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Single-node Kafka in KRaft mode (no ZooKeeper). Two listeners: containers use
  # kafka:29092, processes on the host use localhost:9092.
  kafka:
    image: apache/kafka:3.9.0
    container_name: notification-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,CONTROLLER://:29093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      # Topics are created explicitly (app.scripts.kafka_topics), never by a typo.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # Single broker: internal topics cannot be replicated. Production uses 3 / min ISR 2.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  # Local SMTP sink for the real email adapter. SMTP on 1025, web inbox on 8025.
  mailpit:
    image: axllent/mailpit:v1.21
    container_name: notification-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  # One-shot: apply migrations, then exit. API and worker wait for it to succeed,
  # so the app never starts against an old schema and never runs create_all().
  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  # One-shot: create Kafka topics explicitly (broker auto-creation is off).
  kafka-init:
    <<: *app
    command: ["python", "-m", "app.scripts.kafka_topics"]
    depends_on:
      kafka:
        condition: service_healthy

  api:
    <<: *app
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 5

  # DISPATCH_MODE=kafka (set in x-app): the relay publishes the outbox, the worker
  # consumes Kafka. For SKIP LOCKED polling instead, set DISPATCH_MODE=postgres,
  # change the worker command to app.workers.delivery_worker, and drop the relay.
  relay:
    <<: *app
    command: ["python", "-m", "app.workers.outbox_relay"]
    environment:
      <<: *app-env
      METRICS_PORT: "9101"
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully

  worker:
    <<: *app
    command: ["python", "-m", "app.workers.kafka_consumer"]
    environment:
      <<: *app-env
      METRICS_PORT: "9102"
    restart: unless-stopped
    # SIGTERM lets the worker finish its in-flight batch and leave the consumer group.
    stop_grace_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully

  # Observability: Prometheus scrapes the API (/metrics), relay (:9101) and
  # workers (:9102); Grafana is provisioned with the data source and dashboard.
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: notification-prometheus
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.3.0
    container_name: notification-grafana
    restart: unless-stopped
    environment:
      # Local only: anonymous read access, so the dashboard opens without a login.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/notification-platform.json
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  postgres_data:

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: notifications_test
          POSTGRES_USER: notification_app
          POSTGRES_PASSWORD: ci_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U notification_app -d notifications_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      kafka:
        image: apache/kafka:3.9.0
        ports: ["9092:9092"]
        env:
          KAFKA_NODE_ID: "1"
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: INTERNAL://:29092,CONTROLLER://:29093,EXTERNAL://:9092
          KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
          KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval 10s --health-timeout 10s --health-retries 12
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://notification_app:ci_password@localhost:5432/notifications_test
      TEST_DATABASE_URL: postgresql+psycopg://notification_app:ci_password@localhost:5432/notifications_test
      WEBHOOK_SECRET_ENCRYPTION_KEY: UtdpRhP4WrBOSC0yYXp2TYAniAUkhyKZF8AhZphjqIQ=
      EMAIL_PROVIDER: fake
      TEST_REDIS_URL: redis://localhost:6379/15
      TEST_KAFKA_BOOTSTRAP_SERVERS: localhost:9092
      # Every service is provided here, so any skipped test is lost coverage: fail.
      CI_REQUIRE_ALL_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # Fresh database -> head proves the migration chain works from scratch,
      # downgrade/upgrade proves it is reversible, check proves models match it.
      - run: alembic upgrade head
      - run: alembic downgrade base && alembic upgrade head
      - run: alembic check
      - run: pytest -q -rs

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The image must build and import the app; the stack itself is exercised locally.
      - run: docker build -t notification-platform:ci .
      - run: docker run --rm -e DATABASE_URL=postgresql+psycopg://u:p@localhost/db notification-platform:ci python -c "import app.main, app.workers.delivery_worker"

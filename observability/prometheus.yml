# Local scrape config. 5 s is aggressive (production: 15-30 s) but makes a short
# load test visible in Grafana.
global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  - job_name: relay
    static_configs:
      - targets: ["relay:9101"]

  # DNS discovery: `docker compose up --scale worker=3` adds every replica.
  - job_name: worker
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 9102

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
